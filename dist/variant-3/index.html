<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf2f3">
<meta name="description" content="Nails by Fati Balakchi — професионален маникюр, обучения и материали за аерограф в Пещера.">
<title>Plum Signature — Nails by Fati Balakchi — Красотата е в детайлите</title>
<style>
:root{--ink:#492833;--muted:#75515e;--rose:#8a4058;--line:#dcc5cc;--paper:#fbf2f3}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);background:var(--paper);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#e9becb;color:var(--ink)}
.page{position:relative;isolation:isolate;height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:0 clamp(24px,4.8vw,88px)}
.backdrop{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(251,242,243,.35),rgba(251,242,243,.16) 35%,transparent 57%);pointer-events:none}
header{display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:108px;border-bottom:1px solid rgba(117,81,94,.19)}
.brand{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap}
.brand-name{font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1;font-weight:400;font-style:italic;letter-spacing:-1.2px}
.brand-owner{font-size:9px;line-height:1.6;letter-spacing:3.3px;padding-left:3px}
nav{display:flex;align-items:center;justify-content:flex-end;gap:clamp(12px,1.5vw,26px)}
button{font:inherit;color:inherit;cursor:default}
button:disabled{opacity:1;-webkit-text-fill-color:currentColor;cursor:default}
.nav-item{position:relative;padding:12px 0;background:none;border:0;font-size:12px;line-height:1.4;white-space:nowrap;color:#603b49}
.nav-item.active{color:var(--rose)}
.nav-item.active:after{content:'';position:absolute;bottom:2px;left:0;right:0;height:1px;background:var(--rose)}
.menu{display:none;width:36px;height:36px;border:0;background:transparent;padding:8px}
.menu svg{width:100%;height:100%;stroke:var(--ink);stroke-width:1.4;fill:none}
main{display:flex;align-items:center;min-height:0;padding:28px 0 34px}
.hero{width:49%;max-width:640px;padding-bottom:2vh}
h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(44px,5.15vw,88px);font-weight:400;line-height:1.12;letter-spacing:-.035em;margin:0 0 24px;text-wrap:balance}
h1 em{color:var(--rose);font-weight:400}
.intro{max-width:420px;font-size:15px;line-height:1.85;margin:0;color:var(--muted);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:24px;min-height:51px;padding:0 25px;border:1px solid var(--rose);font-size:12px;letter-spacing:.2px;border-radius:2px}
.cta.primary{background:var(--rose);color:#fff9fa}
.cta.secondary{background:rgba(251,242,243,.44);color:var(--rose)}
.arrow{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.3;flex:none}
.signature{display:flex;align-items:center;gap:12px;margin:30px 0 0;color:var(--muted);font-size:10px;letter-spacing:1.6px;line-height:1.5;text-transform:uppercase}
.signature:before{content:'';width:30px;height:1px;background:#b68c9b}
footer{padding-bottom:19px}
.offerings{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:23px 0 21px;background:rgba(251,242,243,.94)}
.offering{padding:0 28px;border-right:1px solid var(--line);display:flex;gap:17px;align-items:flex-start}
.offering:first-child{padding-left:0}.offering:last-child{border:0}
.service-icon{width:29px;height:33px;flex:none;stroke:var(--rose);stroke-width:1.2;fill:none}
h2{font-family:Georgia,'Times New Roman',serif;font-size:21px;line-height:1.2;font-weight:400;margin:0 0 7px}
.offering p{font-size:11px;line-height:1.65;color:var(--muted);margin:0}
.footer-line{display:flex;justify-content:space-between;align-items:center;padding-top:13px;border-top:0;font-size:9px;letter-spacing:1.2px;color:var(--muted)}
.location{display:flex;gap:7px;align-items:center}.location svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.3}
@media(min-width:1750px){.page{padding-left:7vw;padding-right:7vw}.hero{width:46%}}
@media(max-width:1250px){header{gap:20px;min-height:95px}.brand-name{font-size:29px}.brand-owner{font-size:8px;letter-spacing:2.7px}nav{gap:13px}.nav-item{font-size:10px}.hero{width:48%}.intro{font-size:14px;max-width:350px}.cta{padding:0 19px;gap:16px;font-size:11px}.offering{gap:12px;padding:0 20px}h2{font-size:19px}}
@media(max-width:1000px){nav{display:grid;grid-template-columns:repeat(4,auto);gap:0 20px}.nav-item{padding:6px 0}.nav-item.active:after{bottom:1px}h1{font-size:clamp(42px,5.3vw,60px)}.hero{width:51%}.intro{font-size:13px}.actions{gap:10px;margin-top:25px}.cta{min-height:44px;gap:12px;padding:0 16px}.signature{font-size:9px;letter-spacing:1px}.offering{padding:0 16px;gap:10px}.service-icon{width:23px;height:27px}h2{font-size:17px}.offering p{font-size:10px}}
@media(max-width:650px){.page{padding:0 24px}.backdrop{object-position:66% bottom}.veil{background:linear-gradient(180deg,rgba(251,242,243,.96),rgba(251,242,243,.94) 27%,rgba(251,242,243,.83) 43%,rgba(251,242,243,.04) 70%)}header{min-height:84px}.brand{align-items:flex-start}.brand-name{font-size:29px}.brand-owner{font-size:8px;letter-spacing:2.6px;padding-left:1px}nav{display:none}.menu{display:block}main{align-items:flex-start;padding:30px 0 0}.hero{width:100%;max-width:400px;padding-bottom:0}h1{font-size:clamp(39px,10.5vw,60px);line-height:1.08;margin-bottom:18px;max-width:380px}.intro{font-size:12px;line-height:1.75;max-width:315px}.actions{margin-top:22px;gap:10px}.cta{font-size:10px;min-height:43px;padding:0 15px;gap:12px}.signature{margin-top:21px;font-size:8px;letter-spacing:1.3px}.signature:before{width:24px}footer{padding-bottom:13px}.offerings{padding:17px 0 14px;gap:13px}.offering{display:block;padding:0 10px 0 0}.offering:first-child{padding-right:10px}.offering:last-child{padding:0}.service-icon{display:none}h2{font-size:15px;line-height:1.2;margin-bottom:5px}.offering p{font-size:8px;line-height:1.6}.footer-line{font-size:7px;letter-spacing:.7px;padding-top:11px}.location{gap:4px}}
@media(max-height:720px) and (min-width:651px){header{min-height:78px}main{padding:20px 0}.hero{padding:0}h1{font-size:clamp(40px,4.7vw,65px);margin-bottom:17px}.intro{font-size:13px;line-height:1.7}.actions{margin-top:23px}.signature{margin-top:20px}.offerings{padding:17px 0 15px}footer{padding-bottom:13px}}
@media(max-height:700px) and (max-width:650px){header{min-height:65px}.brand-name{font-size:25px}.brand-owner{font-size:7px}main{padding-top:20px}h1{font-size:39px;margin-bottom:14px}.intro{font-size:11px;line-height:1.6}.actions{margin-top:17px}.cta{min-height:38px}.signature{margin-top:15px}.offerings{padding:13px 0 11px}h2{font-size:14px}.offering p{font-size:7.5px}.footer-line{padding-top:9px}}
@media(max-height:480px){header{min-height:55px}.brand-name{font-size:23px}.brand-owner{font-size:7px}main{padding:10px 0}.hero{width:58%}h1{font-size:34px;margin-bottom:10px}.intro{font-size:10px;line-height:1.5;max-width:360px}.actions{margin-top:12px}.cta{min-height:34px;padding:0 14px;font-size:10px}.signature{display:none}.offerings{padding:9px 0}h2{font-size:14px;margin-bottom:3px}.offering p{font-size:8px}.service-icon{width:20px;height:23px}.footer-line{padding-top:7px;font-size:7px}footer{padding-bottom:8px}}
.brand-owner{font-size:11px;letter-spacing:2px}
.nav-item,.cta{font-size:11px}
.signature{font-size:11px;letter-spacing:.7px}
.footer-line{font-size:10px;letter-spacing:.5px}
.offering p{font-size:11px}
@media(max-width:650px){.brand-owner{font-size:10px;letter-spacing:1.8px}.signature{font-size:10px;letter-spacing:.5px}.offering p{font-size:10px;line-height:1.5}.footer-line{font-size:9px;letter-spacing:.2px}.offerings{gap:10px}.offering{padding-right:9px}.offering br{display:none}.footer-line>span:last-child{letter-spacing:0}}
.footer-line{border:0}.signature:before{display:none}.brand-name{letter-spacing:-.8px}@media(max-width:650px){.intro{font-size:13px}.cta{font-size:11px}.footer-line{font-size:9px}}
:root{--paper:#35222f;--ink:#fff2ee;--muted:#e3cbd4;--rose:#edb5c5;--line:#644051}.page{padding:0 4.8vw}.backdrop{left:48%;width:52%;object-position:75% center}.veil{background:linear-gradient(90deg,#35222f 0%,#35222f 43%,rgba(53,34,47,.45) 51%,transparent 64%)}header{border-bottom-color:rgba(255,238,243,.2);background:linear-gradient(90deg,#35222f,rgba(53,34,47,.85));margin:0 -4.8vw;padding:0 4.8vw;min-height:102px}.nav-item{color:#fbe4ed}.nav-item.active{color:#edb5c5}.hero{width:46%;padding:0}h1{font-size:clamp(46px,5.1vw,82px)}.intro{max-width:365px;font-size:14px}.cta.primary{background:#edb5c5;border-color:#edb5c5;color:#35222f}.cta.secondary{background:transparent;color:#f9dce5;border-color:#a9768e}.cta{border-radius:0;gap:17px;padding:0 21px}.signature{color:#e3cbd4;font-size:10px;letter-spacing:.8px}.footer-line{color:#fbe4ed;text-shadow:0 1px 4px #35222f}footer{padding-bottom:22px}
@media(max-width:1000px){.actions{flex-direction:column;align-items:flex-start}.cta{min-width:180px}}
@media(max-width:650px){header{min-height:82px;background:#35222f}.menu svg{stroke:#fbe4ed}.backdrop{left:0;top:35%;width:100%;height:65%;object-position:70% center}.veil{background:linear-gradient(180deg,#35222f 0%,#35222f 30%,rgba(53,34,47,.92) 43%,rgba(53,34,47,.05) 68%,rgba(53,34,47,.25))}.hero{width:100%}main{padding-top:30px}h1{font-size:43px}.intro{font-size:12px;max-width:320px}.actions{flex-direction:row;gap:10px;margin-top:22px}.cta{min-width:0;min-height:42px;font-size:10px;gap:10px;padding:0 13px}.signature{display:none}.footer-line{font-size:9px}}
@media(max-height:700px) and (max-width:650px){h1{font-size:36px}main{padding-top:20px}.intro{font-size:11px}.actions{margin-top:16px}}
</style>
</head>
<body>
<div class="page">
  <img class="backdrop" src="/nails.png" alt="Розов маникюр с нежни флорални декорации" draggable="false" fetchpriority="high">
  <div class="veil" aria-hidden="true"></div>
  <header>
    <div class="brand" aria-label="Nails by Fati Balakchi"><span class="brand-name">Nails by Fati</span><span class="brand-owner">FATI BALAKCHI</span></div>
    <nav aria-label="Основна навигация">
      <button class="nav-item active" disabled aria-current="page">Начало</button>
      <button class="nav-item" disabled>Салон</button>
      <button class="nav-item" disabled>Курсове и обучения</button>
      <button class="nav-item" disabled>Материали за аерограф</button>
      <button class="nav-item" disabled>За нас</button>
      <button class="nav-item" disabled>Галерия</button>
      <button class="nav-item" disabled>Новини и блог</button>
      <button class="nav-item" disabled>Контакти</button>
    </nav>
    <button class="menu" disabled aria-label="Меню"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Красотата е<br> в <em>детайлите.</em></h1>
      <p class="intro">Маникюр с характер. Обучения с вдъхновение.<br> Открийте света на професионалната грижа, авторския нейл арт и изкуството на аерографа с Фати Балъкчи.</p>
      <div class="actions">
        <button class="cta primary" disabled>Запази час<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5"/></svg></button>
        <button class="cta secondary" disabled>Курсове и обучения<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></button>

    </section>
  </main>
  <footer>
    <div class="footer-line"><span class="location"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M14 7c0 4-5 9-5 9S4 11 4 7a5 5 0 1 1 10 0Z"/><circle cx="9" cy="7" r="1.5"/></svg>ПЕЩЕРА, БЪЛГАРИЯ</span><span>NAILS BY FATI BALAKCHI</span></div>
  </footer>
</div>
</body>
</html>
